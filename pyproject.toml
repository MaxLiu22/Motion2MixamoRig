[project]
name = "motion2mixamorig"
version = "0.1.8"
description = "Retarget human motion from video or a still pose to an Adobe Mixamo-rigged 3D character."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "einops",
    "scipy",  # nearest-surface search in `m2mr diagnose` (also pulled in by gvhmr)
    # Optional finger pass (`--detect-hands`): HaMeR + MANO. Not imported
    # unless that flag is on.
    "timm",
    "smplx",
    "scikit-image",
    # Video -> 3D human skeleton. `preproc` = person detection/tracking,
    # `rtmpose` = the ungated 2D-pose backend the pipeline uses.
    "gvhmr[preproc,rtmpose]>=1.6",
]

[project.scripts]
m2mr = "motion2mixamorig.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motion2mixamorig*"]
